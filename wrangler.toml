name = "ssh-bot"
main = "worker.js"
compatibility_date = "2024-09-01"
account_id = "你的Cloudflare账户ID"  # Dashboard 右下角 Account ID

[[kv_namespaces]]
binding = "SSH_KV"
id = "你的KV命名空间ID"  # wrangler kv namespace create SSH_KV 后获得

[triggers]
crons = ["* * * * *"]

# VPS 服务器列表（格式：id:名称:https://域名:端口，用 | 分割）
[vars]
VPS_SERVERS = "vps1:香港:https://ssh-vps1.你的域名.com:2087|vps2:日本:https://ssh-vps2.你的域名.com:2087"

# 自定义域名路由（Telegram Webhook 入口）
[[routes]]
pattern = "bot-ssh.你的域名.com"
custom_domain = true
